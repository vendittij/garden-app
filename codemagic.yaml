# Codemagic CI — Garden App
# Docs: https://docs.codemagic.io/yaml-quick-start/building-a-react-native-app/
#
# This workflow builds an UNSIGNED iOS .ipa for sideloading via Sideloadly.
# No Apple Developer account or code signing credentials are required.
# Sideloadly re-signs the .ipa with your free Apple ID before installing.
#
# Setup (one-time):
#   1. Create a free account at https://codemagic.io
#   2. Connect this GitHub repository
#   3. Codemagic will detect this file and show the workflow in the dashboard
#   4. Click "Start new build" → select the ios-unsigned workflow
#   5. Download the .ipa artifact when the build finishes
#   6. Sideload onto your iPhone using Sideloadly (https://sideloadly.io)

workflows:
  ios-unsigned:
    name: iOS Unsigned Build (Sideloadly)
    max_build_duration: 60

    environment:
      # Node and Xcode versions — match RN 0.83.2 / Expo SDK 55 requirements
      node: v20.19.0
      xcode: 16.2
      cocoapods: default

    cache:
      cache_paths:
        - $CM_BUILD_DIR/node_modules
        - $HOME/.cocoapods/repos

    scripts:
      - name: Install Node dependencies
        script: npm ci

      - name: Generate iOS native project via expo prebuild
        script: |
          # expo prebuild generates the ios/ directory from app.json config.
          # ios/ is intentionally gitignored — the cloud machine generates it fresh every build.
          npx expo prebuild --platform ios --clean --non-interactive

      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install

      - name: Build unsigned iOS archive
        script: |
          cd ios

          # Discover workspace name generated by expo prebuild (handles name with spaces).
          WORKSPACE=$(find . -name "*.xcworkspace" -maxdepth 2 | grep -v "Pods" | head -1 | xargs basename)
          SCHEME="${WORKSPACE%.xcworkspace}"
          echo "Building workspace: $WORKSPACE  |  scheme: $SCHEME"

          mkdir -p "$HOME/artifacts"

          xcodebuild archive \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -archivePath "$HOME/artifacts/GardenApp.xcarchive" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            EXPANDED_CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            | xcpretty

      - name: Package IPA from archive
        script: |
          # Manually zip the .app bundle into a .ipa structure.
          # This produces an unsigned IPA that Sideloadly can re-sign and install.
          APP_PATH=$(find "$HOME/artifacts/GardenApp.xcarchive/Products/Applications" -name "*.app" | head -1)
          echo "Found app bundle: $APP_PATH"

          mkdir -p "$HOME/artifacts/ipa/Payload"
          cp -r "$APP_PATH" "$HOME/artifacts/ipa/Payload/"

          cd "$HOME/artifacts/ipa"
          zip -r "$HOME/artifacts/GardenApp-unsigned.ipa" Payload

          echo "IPA ready: $HOME/artifacts/GardenApp-unsigned.ipa"
          ls -lh "$HOME/artifacts/GardenApp-unsigned.ipa"

    artifacts:
      # Download this .ipa from the Codemagic build page and sideload via Sideloadly
      - $HOME/artifacts/GardenApp-unsigned.ipa
